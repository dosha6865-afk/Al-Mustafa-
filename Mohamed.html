<style>

body{margin:0;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
a{color:var(--g);text-decoration:none}h1,h2,h3{margin:.2em 0 .5em;line-height:1.3}h2{font-size:1.35rem}h3{font-size:1.05rem}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--g)}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}

main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}

input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px var(--gl2)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-weight:700;max-width:92vw;box-shadow:var(--sh)}
.toast.ok{background:var(--g)}.toast.err{background:var(--red)}
.mback{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--sh)}.modal.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.mb{padding:16px 18px 24px}
.x{border:0;background:#f1f5f9;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
@media(min-width:700px){.mback{align-items:center}.modal{border-radius:22px}}
.big-code{font-size:2.2rem;font-weight:800;letter-spacing:.12em;color:var(--g);direction:ltr;display:inline-block}
.qrbox{background:#fff;border:2px dashed var(--g3);border-radius:20px;padding:16px;text-align:center}
.qrbox img{width:min(78vw,300px);height:auto;image-rendering:pixelated}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}.bar>*{flex:0 0 auto}.bar .grow{flex:1 1 200px}
.pbar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--g2)}
.phrase{color:var(--g);font-weight:800;text-align:center;padding:18px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}.tabs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.list>div{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.list>div:last-child{border:0}
.unread{border-inline-start:5px solid var(--g2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.kv dt{color:var(--mut);font-weight:700}.kv dd{margin:0;font-weight:700}
footer.f{text-align:center;color:var(--mut);padding:20px;font-size:.85rem}
@media print{header.top,nav.pills,.noprint,.toast,footer.f{display:none!important}body{background:#fff}main{padding:0}.card,.stat{box-shadow:none}.tw{max-height:none;overflow:visible}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword, reauthenticateWithCredential, EmailAuthProvider, deleteUser } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, updateDoc, collection, query, where, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDr753V8JSOXAlH13FczH1gjIbLYwfaXJQ",
  authDomain: "almostfa-d4666.firebaseapp.com",
  databaseURL: "https://almostfa-d4666-default-rtdb.firebaseio.com",
  projectId: "almostfa-d4666",
  storageBucket: "almostfa-d4666.firebasestorage.app",
  messagingSenderId: "40005003965",
  appId: "1:40005003965:web:7dc9a33ead504237c265d4",
  measurementId: "G-NM0CPYQC9N"
};

const EMAIL_DOMAIN = "mostafa-math.app";
const TZ = "Africa/Cairo";
const LOW_ATT = 75; // أي نسبة حضور أقل من كده تظهر تنبيه للطالب
let fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = getFirestore(fbApp);

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const PHRASES = ["كل مسألة ليها حل", "افهمها، ما تحسبهاش", "طريق التفوق بيبدأ بالمعادلة", "مع المصطفى، كل معادلة ليها حل"];
const rnd = a => a[Math.floor(Math.random() * a.length)];
const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ar");
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, "0")).join("");
const normPhone = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");

const _fmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function cairoParts(d = new Date()) { const o = {}; _fmt.formatToParts(d).forEach(p => o[p.type] = p.value); return o; }
const fmtTime = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "م" : "ص"}`; };
const sched = g => `${(g.days || []).map(d => DAYS[d]).join("، ")} • ${fmtTime(g.start)} – ${fmtTime(g.end)}`;
const fmtDate = s => s ? new Date(s + "T12:00:00Z").toLocaleDateString("ar-EG", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
const fmtTs = t => t && t.toDate ? t.toDate().toLocaleString("ar-EG", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" }) : "";

function toast(m, t = "ok") { const d = document.createElement("div"); d.className = "toast " + t; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }
function openModal(title, html, wide) {
  const w = document.createElement("div"); w.className = "mback";
  w.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><div class="mh"><b>${esc(title)}</b><button class="x" data-close aria-label="إغلاق">✕</button></div><div class="mb">${html}</div></div>`;
  w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-close]")) w.remove(); });
  document.body.appendChild(w); return w;
}
function errMsg(e) {
  const c = e && (e.code || ""); if (e && e.msg) return e.msg;
  const M = {
    "auth/invalid-credential": "بيانات الدخول غير صحيحة", "auth/wrong-password": "كلمة المرور غير صحيحة", "auth/user-not-found": "الحساب غير موجود",
    "auth/invalid-email": "صيغة البريد غير صحيحة", "auth/email-already-in-use": "هذا الحساب موجود بالفعل", "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل)",
    "auth/too-many-requests": "محاولات كثيرة، انتظر قليلًا ثم حاول مرة أخرى", "auth/network-request-failed": "مشكلة في الاتصال بالإنترنت",
    "auth/operation-not-allowed": "فعّل Email/Password من Authentication في Firebase", "auth/requires-recent-login": "سجّل الدخول من جديد ثم أعد المحاولة",
    "permission-denied": "ليس لديك صلاحية لتنفيذ هذا الإجراء (أو أن القواعد لم تُنشر بعد)", "unavailable": "الخدمة غير متاحة الآن، تأكد من الإنترنت",
    "failed-precondition": "يلزم إنشاء فهرس أو إعداد في Firebase: " + (e && e.message || ""), "not-found": "العنصر غير موجود"
  };
  return M[c] || ("حدث خطأ: " + (e && e.message || e));
}
async function run(el, fn) {
  const b = el && el.closest ? el.closest("button,.btn") : null; if (b) b.disabled = true;
  try { return await fn(); } catch (e) { console.error(e); toast(errMsg(e), "err"); } finally { if (b) b.disabled = false; }
}
const ACT = {};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (!t) return; const f = ACT[t.dataset.act]; if (f) { if (t.tagName === "A") e.preventDefault(); run(t, () => f(t, e)); } });
document.addEventListener("submit", e => { const f = e.target.closest("form[data-submit]"); if (!f) return; e.preventDefault(); const fn = ACT[f.dataset.submit]; if (fn) run(f.querySelector("button[type=submit]"), () => fn(f, e)); });
const formData = f => Object.fromEntries(new FormData(f));
const statusChip = s => s === "present" ? `<span class="chip ok">حاضر</span>` : s === "absent" ? `<span class="chip bad">غائب</span>` : s === "excused" ? `<span class="chip warn">مستأذن</span>` : `<span class="chip">—</span>`;
function attStats(recs) {
  const p = recs.filter(r => r.status === "present").length, a = recs.filter(r => r.status === "absent").length, e = recs.filter(r => r.status === "excused").length;
  const base = p + a; return { p, a, e, total: p + a + e, pct: base ? Math.round(p / base * 100) : null };
}
const sortRecs = rs => [...rs].sort((x, y) => String(y.date).localeCompare(String(x.date)) || ((y.markedAt?.seconds || 0) - (x.markedAt?.seconds || 0)));
const mapDocs = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
// تنبيه انخفاض الحضور
const lowAlert = st => (st.pct !== null && st.pct < LOW_ATT) ? `<div class="alertlow"><span style="font-size:1.8rem">⚠️</span><div>نسبة حضورك ${st.pct}% وهي أقل من ${LOW_ATT}%<small>لازم تنتظم في الحضور عشان ما يأثرش على مستواك.</small></div></div>` : "";

const app = $("#app");
const S = { stu: null, uid: null, centers: [], groups: [], enrolls: [], records: [], inbox: [], results: [], tracks: [], hw: null, hwKey: "", unsubs: [], hwUnsub: null, registering: false, ready: false };
const NAV = [["home", "الرئيسية"], ["groups", "السناتر والمجموعات"], ["track", "المتابعة"], ["homework", "الواجبات"], ["exams", "الامتحانات"], ["notifications", "الإشعارات"], ["qr", "كود QR"], ["account", "حسابي"]];
const activeEnrolls = () => S.enrolls.filter(e => e.active);
const myGroups = () => activeEnrolls().map(e => S.groups.find(g => g.id === e.groupId)).filter(Boolean);
const unreadCount = () => S.inbox.filter(n => !n.read).length;
const qrText = () => `MSTF1|${S.uid}|${S.stu.qrToken}`;

async function loadPublic() {
  const [c, g] = await Promise.all([getDocs(collection(db, "centers")), getDocs(collection(db, "groups"))]);
  S.centers = mapDocs(c).sort(byName); S.groups = mapDocs(g).filter(x => x.active !== false).sort(byName);
}
function stopListeners() { S.unsubs.forEach(f => f()); S.unsubs = []; if (S.hwUnsub) { S.hwUnsub(); S.hwUnsub = null; } S.hw = null; S.hwKey = ""; }

// الواجبات: متابعة حية، وتتحدث تلقائيًا لما تتغير مجموعات الطالب أو المدرس يضيف واجب
function watchHomework() {
  const ids = activeEnrolls().map(e => e.groupId).slice(0, 30), key = ids.slice().sort().join(",");
  if (key === S.hwKey && S.hw !== null) return;
  S.hwKey = key; if (S.hwUnsub) { S.hwUnsub(); S.hwUnsub = null; }
  if (!ids.length) { S.hw = []; return; }
  S.hwUnsub = onSnapshot(query(collection(db, "homework"), where("groupIds", "array-contains-any", ids)), s => { S.hw = mapDocs(s); softRender(); }, e => { console.warn("homework", e); S.hw = []; softRender(); });
}

// لا نعيد الرسم والطالب بيكتب في حقل (عشان ما يتفرغش اللي كتبه)
let rt = null;
const softRender = () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app.contains(a)) { rt = setTimeout(softRender, 1500); return; }
    render();
  }, 60);
};
function startListeners(uid) {
  stopListeners();
  const L = (q, key, after) => S.unsubs.push(onSnapshot(q, s => { S[key] = mapDocs(s); if (after) after(); softRender(); }, e => console.warn(key, e)));
  L(query(collection(db, "groupEnrollments"), where("studentId", "==", uid)), "enrolls", watchHomework);
  L(query(collection(db, "attendanceRecords"), where("studentId", "==", uid)), "records");
  L(query(collection(db, "inbox"), where("studentId", "==", uid)), "inbox");
  L(query(collection(db, "examResults"), where("studentId", "==", uid), where("published", "==", true)), "results");
  L(query(collection(db, "homeworkTracking"), where("studentId", "==", uid)), "tracks");
  S.unsubs.push(onSnapshot(doc(db, "students", uid), s => { if (s.exists()) { S.stu = { id: uid, ...s.data() }; softRender(); } }));
}

onAuthStateChanged(auth, async u => {
  S.uid = u ? u.uid : null;
  if (!u) { stopListeners(); S.stu = null; S.enrolls = S.records = S.inbox = S.results = S.tracks = []; S.ready = true; try { await loadPublic(); } catch (e) { console.warn(e); } render(); return; }
  if (S.registering) return;
  try {
    const sn = await getDoc(doc(db, "students", u.uid));
    if (!sn.exists()) { await signOut(auth); toast("هذا الحساب ليس حساب طالب", "err"); return; }
    if (sn.data().active === false) { await signOut(auth); toast("هذا الحساب معطّل، تواصل مع الإدارة", "err"); return; }
    S.stu = { id: u.uid, ...sn.data() };
    await loadPublic(); startListeners(u.uid);
  } catch (e) { console.error(e); toast(errMsg(e), "err"); }
  S.ready = true; render();
});
window.addEventListener("hashchange", render);

const PRIV = NAV.map(n => n[0]);
function shell(inner, active) {
  const logged = !!S.stu;
  app.innerHTML = `<header class="top"><a class="logo" href="#/${logged ? "home" : ""}"><span class="mark">√</span><span>المصطفى في الرياضيات<small>الأستاذ محمد مصطفى</small></span></a><span class="sp"></span>
    ${logged ? `<button class="btn ghost sm" data-act="logout">خروج</button>` : `<a class="btn ghost sm" href="#/login">دخول</a><a class="btn sm" href="#/signup">حساب جديد</a>`}</header>
    ${logged ? `<nav class="pills">${NAV.map(([k, t]) => `<a href="#/${k}" class="${k === active ? "on" : ""}">${t}${k === "notifications" && unreadCount() ? `<span class="dot">${unreadCount()}</span>` : ""}</a>`).join("")}</nav>` : ""}
    <main>${inner}</main><footer class="f">${rnd(PHRASES)} 💚</footer>`;
}
ACT.logout = async () => { await signOut(auth); location.hash = "#/"; };

function render() {
  const r = (location.hash || "#/").slice(2).split("?")[0];
  if (!S.ready) { app.innerHTML = `<div class="spin"></div>`; return; }
  if (S.stu && ["", "login", "signup"].includes(r)) { location.hash = "#/home"; return; }
  if (!S.stu && PRIV.includes(r)) { location.hash = "#/login"; return; }
  const v = V[r] || V[""]; v();
  if (S.stu) window.scrollTo(0, window.scrollY);
}

const grpLine = g => { const c = S.centers.find(x => x.id === g.centerId); return `<b>${esc(g.name)}</b> <span class="mut">— ${esc(c ? c.name : g.centerName || "")}</span><div class="sm mut">${esc(sched(g))}</div>`; };
const V = {};

V[""] = () => shell(`

    <div class="card"><h3>📊 النتائج والإشعارات</h3><p class="mut">درجاتك وإشعارات مجموعتك في مكان واحد.</p></div></div>

V.login = () => shell(`<div class="card auth"><h2>تسجيل الدخول</h2><p class="mut">ادخل برقم التليفون أو كود الطالب.</p>
  <form data-submit="login"><label>رقم التليفون أو كود الطالب</label><input name="id" inputmode="numeric" autocomplete="username" required placeholder="01xxxxxxxxx أو 123456">
  <label>كلمة المرور</label><input name="pw" type="password" autocomplete="current-password" required>
  <div id="lerr"></div><button class="btn" style="width:100%;margin-top:14px" type="submit">دخول</button></form>
  <p class="c sm">ليس لديك حساب؟ <a href="#/signup">أنشئ حسابًا</a></p><div class="phrase" style="padding:6px">مع المصطفى، كل معادلة ليها حل</div></div>`, "");
ACT.login = async f => {
  const { id, pw } = formData(f); const x = normPhone(id); let code;
  if (/^01\d{9}$/.test(x)) {
    const pi = await getDoc(doc(db, "phoneIndex", x));
    if (!pi.exists()) throw { msg: "لا يوجد حساب بهذا الرقم" };
    code = pi.data().code;
  } else if (/^\d{6}$/.test(x)) code = x; else throw { msg: "أدخل رقم تليفون صحيح (11 رقم) أو كود الطالب (6 أرقام)" };
  await signInWithEmailAndPassword(auth, `${code}@${EMAIL_DOMAIN}`, pw);
};

V.signup = () => {
  const grades = [...new Set(S.groups.map(g => g.grade))].filter(Boolean);
  shell(`<div class="card auth" style="max-width:520px"><h2>إنشاء حساب طالب</h2><p class="mut">طريق التفوق بيبدأ بالمعادلة.</p>
  ${grades.length ? "" : `<div class="note">لم يضف المدرس أي مجموعات بعد، حاول لاحقًا.</div>`}
  <form data-submit="signup" id="sf">
  <label>الاسم الكامل</label><input name="name" required minlength="3" maxlength="80" autocomplete="name">
  <label>رقم تليفون الطالب</label><input name="phone" inputmode="numeric" required placeholder="01xxxxxxxxx" maxlength="11">
  <label>رقم تليفون ولي الأمر</label><input name="parent" inputmode="numeric" required placeholder="01xxxxxxxxx" maxlength="11">
  <label>السنة الدراسية</label><select name="grade" id="sg" required><option value="">اختر السنة</option>${grades.map(g => `<option>${esc(g)}</option>`).join("")}</select>
  <label>السنتر</label><select name="center" id="sc" required disabled><option value="">اختر السنة أولًا</option></select>

  <label>كلمة المرور (6 أحرف على الأقل)</label><input name="pw" type="password" minlength="6" required autocomplete="new-password">
  <label>تأكيد كلمة المرور</label><input name="pw2" type="password" minlength="6" required autocomplete="new-password">
  <button class="btn" style="width:100%;margin-top:14px" type="submit" ${grades.length ? "" : "disabled"}>إنشاء الحساب</button></form>
  <p class="c sm">لديك حساب؟ <a href="#/login">سجّل الدخول</a></p></div>`, "");
  const sg = $("#sg"), sc = $("#sc"), sgr = $("#sgr");
  sg && sg.addEventListener("change", () => {
    const cs = [...new Set(S.groups.filter(g => g.grade === sg.value).map(g => g.centerId))];
    sc.innerHTML = `<option value="">اختر السنتر</option>` + cs.map(id => `<option value="${esc(id)}">${esc((S.centers.find(c => c.id === id) || {}).name || id)}</option>`).join(""); sc.disabled = !sg.value;
    sgr.innerHTML = `<option value="">اختر السنتر أولًا</option>`; sgr.disabled = true;
  });
  sc && sc.addEventListener("change", () => {
    const gs = S.groups.filter(g => g.grade === sg.value && g.centerId === sc.value);
    sgr.innerHTML = `<option value="">اختر المجموعة</option>` + gs.map(g => `<option value="${esc(g.id)}">${esc(g.name)} — ${esc(sched(g))}</option>`).join(""); sgr.disabled = !sc.value;
  });
};
ACT.signup = async f => {
  const v = formData(f), name = v.name.trim().replace(/\s+/g, " "), phone = normPhone(v.phone), parent = normPhone(v.parent);
  if (name.length < 3) throw { msg: "اكتب الاسم الكامل" };
  if (!/^01\d{9}$/.test(phone)) throw { msg: "رقم تليفون الطالب غير صحيح (11 رقم يبدأ بـ 01)" };
  if (!/^01\d{9}$/.test(parent)) throw { msg: "رقم ولي الأمر غير صحيح (11 رقم يبدأ بـ 01)" };
  if (phone === parent) throw { msg: "رقم الطالب يجب أن يختلف عن رقم ولي الأمر" };
  if (v.pw.length < 6) throw { msg: "كلمة المرور 6 أحرف على الأقل" };
  if (v.pw !== v.pw2) throw { msg: "كلمتا المرور غير متطابقتين" };
  const g = S.groups.find(x => x.id === v.groupId); if (!g) throw { msg: "اختر المجموعة" };
  S.registering = true; let cred = null;
  try {
    if ((await getDoc(doc(db, "phoneIndex", phone))).exists()) throw { msg: "رقم التليفون مسجل بالفعل، سجّل الدخول بدلًا من ذلك" };
    let code;
    for (let i = 0; i < 10 && !cred; i++) {
      code = String(Math.floor(100000 + Math.random() * 900000));
      try { cred = await createUserWithEmailAndPassword(auth, `${code}@${EMAIL_DOMAIN}`, v.pw); } catch (e) { if (e.code !== "auth/email-already-in-use") throw e; }
    }
    if (!cred) throw { msg: "تعذر إنشاء كود فريد، حاول مرة أخرى" };
    const uid = cred.user.uid, b = writeBatch(db);
    b.set(doc(db, "students", uid), { code, name, phone, parentPhone: parent, grade: g.grade, active: true, qrToken: randHex(24), currentGroupId: g.id, currentCenterId: g.centerId, createdAt: serverTimestamp() });
    b.set(doc(db, "groupEnrollments", `${uid}_${g.id}`), { studentId: uid, studentName: name, groupId: g.id, centerId: g.centerId, grade: g.grade, active: true, joinedAt: serverTimestamp() });
    b.set(doc(db, "phoneIndex", phone), { code, uid, createdAt: serverTimestamp() });
    b.set(doc(db, "users", uid), { name, role: "student", active: true, createdAt: serverTimestamp() });
    try { await b.commit(); } catch (e) { try { await deleteUser(cred.user); } catch (_) { } throw e; }
    const sn = await getDoc(doc(db, "students", uid)); S.stu = { id: uid, ...sn.data() }; S.uid = uid;
    startListeners(uid); S.registering = false; S.ready = true;
    toast("تم إنشاء حسابك بنجاح ✓"); location.hash = "#/home"; render();
    openModal("حسابك جاهز 🎉", `<div class="c"><p>كود الطالب الخاص بك (اسم المستخدم):</p><div class="big-code">${esc(S.stu.code)}</div><p class="mut sm">احتفظ به. تقدر تدخل به أو برقم تليفونك مع كلمة المرور.</p><button class="btn" data-close>تمام</button></div>`);
  } finally { S.registering = false; }
};

V.home = () => {
  const st = attStats(S.records), gs = myGroups(), last = sortRecs(S.records).slice(0, 4), news = [...S.inbox].sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).slice(0, 3);

  <div class="card"><h3>آخر 4 حصص</h3>${last.length ? `<div class="list">${last.map(r => `<div><span>${esc(fmtDate(r.date))}</span>${statusChip(r.status)}</div>`).join("")}</div>` : `<div class="empty">لا توجد حصص مسجلة بعد</div>`}</div></div>

};

V.groups = () => {

  <div class="card"><h3>السجل الكامل</h3>${rs.length ? `<div class="tw"><table><thead><tr><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${rs.map(r => `<tr><td>${esc(fmtDate(r.date))}</td><td>${statusChip(r.status)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">—</div>`}</div>`, "track");

V.homework = () => {
  watchHomework();
  if (S.hw === null) return shell(`<h2>الواجبات</h2><div class="spin"></div>`, "homework");
  const list = [...S.hw].sort((a, b) => String(b.assignedDate).localeCompare(String(a.assignedDate)));
  const tr = id => S.tracks.find(t => t.homeworkId === id);
  // واجب الحصة العام (اللي المساعد بيسجله وقت المسح لما مفيش واجب محدد)

};

};

  ${l.map(n => `<div class="card ${n.read ? "" : "unread"}" data-act="readOne" data-id="${esc(n.id)}" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>${esc(n.title)}</b>${n.read ? "" : `<span class="chip ok">جديد</span>`}</div><p style="margin:.4em 0">${esc(n.body)}</p><div class="sm mut">${esc(fmtTs(n.createdAt))}</div></div>`).join("") || `<div class="empty">لا توجد إشعارات</div>`}`, "notifications");
};

ACT.chpw = async f => {

  await updatePassword(auth.currentUser, v.n1); f.reset(); toast("تم تغيير كلمة المرور");
};

window.MS = { S };
