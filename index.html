<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>المصطفى في الرياضيات — لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#15803d;--g2:#16a34a;--g3:#22c55e;--gl:#ecfdf5;--gl2:#d1fae5;--ink:#0f172a;--mut:#64748b;--line:#e5e7eb;--bg:#f6faf7;--red:#dc2626;--redl:#fee2e2;--amb:#b45309;--ambl:#fef3c7;--r:16px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
a,button,.card{cursor:pointer;touch-action:manipulation}
a{color:var(--g);text-decoration:none}h1,h2,h3{margin:.2em 0 .5em;line-height:1.3}h2{font-size:1.35rem}h3{font-size:1.05rem}
header.top{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--g)}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}
.logo small{display:block;color:var(--mut);font-weight:600;font-size:.72rem;line-height:1.1}
.sp{flex:1}
nav.pills{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:59px;z-index:99;scrollbar-width:none}
nav.pills::-webkit-scrollbar{display:none}
nav.pills a{white-space:nowrap;padding:8px 14px;border-radius:999px;color:var(--mut);font-weight:700;font-size:.92rem}
nav.pills a.on{background:var(--gl2);color:var(--g)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card,.grid+.card{margin-top:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.9rem;line-height:1.2;color:var(--ink)}.stat span{color:var(--mut);font-size:.88rem;font-weight:600}
.stat.ok b{color:var(--g)}.stat.bad b{color:var(--red)}.stat.warn b{color:var(--amb)}
.btn,button.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 18px;background:var(--g2);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:.15s}
.btn:hover{background:var(--g)}.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:#fff;color:var(--g);border:1.5px solid var(--g2)}.btn.ghost:hover{background:var(--gl)}
.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}.btn.sm{min-height:34px;padding:4px 12px;font-size:.88rem;border-radius:10px}.btn.big{min-height:64px;font-size:1.25rem;width:100%;border-radius:18px}
label{display:block;font-weight:700;font-size:.88rem;margin:10px 0 4px;color:#334155}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px var(--gl2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row .grow{flex:1 1 180px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:4px 0}.chk label{margin:0;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800;background:#f1f5f9;color:#475569}
.chip.ok{background:var(--gl2);color:var(--g)}.chip.bad{background:var(--redl);color:var(--red)}.chip.warn{background:var(--ambl);color:var(--amb)}
.mut{color:var(--mut)}.sm{font-size:.85rem}.c{text-align:center}.b{font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.93rem}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}th{color:var(--mut);font-size:.8rem;background:#f8fafc}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.auth{max-width:440px;margin:24px auto}
.err{background:var(--redl);color:var(--red);padding:10px 12px;border-radius:12px;font-weight:700;margin:10px 0}
.note{background:var(--ambl);color:#78350f;padding:10px 12px;border-radius:12px;font-weight:600;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.spin{width:30px;height:30px;border:4px solid var(--gl2);border-top-color:var(--g2);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999;font-weight:700;max-width:92vw}
.toast.ok{background:var(--g)}.toast.err{background:var(--red)}
.mback{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0}.modal.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.mb{padding:16px 18px 24px}
.x{border:0;background:#f1f5f9;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
@media(min-width:700px){.mback{align-items:center}.modal{border-radius:22px}}
.big-code{font-size:2.2rem;font-weight:800;letter-spacing:.12em;color:var(--g);direction:ltr;display:inline-block}
.phrase{color:var(--g);font-weight:800;text-align:center;padding:18px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.kv dt{color:var(--mut);font-weight:700}.kv dd{margin:0;font-weight:700}

/* تصميم كارت التور الفخم */
.fancy-card { background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%); border: 1px solid #bbf7d0; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(22, 163, 74, 0.15); position: relative; overflow: hidden; margin-bottom: 15px; }
.fancy-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px dashed #bbf7d0; padding-bottom: 15px; }
.avatar-circle { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--g2), var(--g)); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 800; }
.fancy-kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 0.95rem; }
.fancy-kv dt { color: var(--mut); font-weight: 700; }
.fancy-kv dd { margin: 0; font-weight: 800; color: var(--ink); }
.okmark{width:84px;height:84px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-size:52px;margin:0 auto 6px;animation:pop .35s}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.okmark.bad{background:var(--red)}.okmark.warn{background:var(--amb)}
</style>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, collection, query, where, orderBy, limit, onSnapshot, writeBatch, serverTimestamp, Timestamp, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDr753V8JSOXAlH13FczH1gjIbLYwfaXJQ", authDomain: "almostfa-d4666.firebaseapp.com", projectId: "almostfa-d4666", storageBucket: "almostfa-d4666.firebasestorage.app", messagingSenderId: "40005003965", appId: "1:40005003965:web:7dc9a33ead504237c265d4" };
const ADMIN_EMAIL = "Mohammed@gmai.com", ADMIN_PASSWORD = "Dosha123";
let fbApp = initializeApp(firebaseConfig), db = getFirestore(fbApp);

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const rnd = a => a[Math.floor(Math.random() * a.length)];
const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ar");
const normPhone = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");

function todayStr() { const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date()); const o={}; p.forEach(x=>o[x.type]=x.value); return `${o.year}-${o.month}-${o.day}`; }
const fmtTime = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "م" : "ص"}`; };
const sched = g => `${(g.days || []).map(d => DAYS[d]).join("، ")} • ${fmtTime(g.start)} – ${fmtTime(g.end)}`;
const fmtDate = s => s ? new Date(s + "T12:00:00Z").toLocaleDateString("ar-EG", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
const fmtTs = t => t && t.toDate ? t.toDate().toLocaleString("ar-EG", { timeZone: "Africa/Cairo", dateStyle: "medium", timeStyle: "short" }) : "";

function toast(m, t = "ok") { const d = document.createElement("div"); d.className = "toast " + t; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }
function openModal(title, html, wide) { const w = document.createElement("div"); w.className = "mback"; w.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><div class="mh"><b>${esc(title)}</b><button class="x" data-close>✕</button></div><div class="mb">${html}</div></div>`; w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-close]")) w.remove(); }); document.body.appendChild(w); return w; }
const closeModals = () => $$(".mback").forEach(m => m.remove());
const mapDocs = s => s.docs.map(d => ({ id: d.id, ...d.data() }));

const app = $("#app");
const A = { user: { uid: "local_admin" }, role: "admin", name: "الأستاذ محمد", centers: [], groups: [] };
const isT = () => A.role === "admin"; 
const gById = id => A.groups.find(g => g.id === id), cById = id => A.centers.find(c => c.id === id);
async function loadBase() { const [c, g] = await Promise.all([getDocs(collection(db, "centers")), getDocs(collection(db, "groups"))]); A.centers = mapDocs(c).sort(byName); A.groups = mapDocs(g).sort(byName); }
const activeGroups = () => A.groups.filter(g => g.active !== false);

function renderLogin() {
  app.innerHTML = `<main><div class="card auth"><div class="logo" style="justify-content:center"><span class="mark">√</span><span>المصطفى في الرياضيات</span></div>
  <form id="loginForm"><label>البريد</label><input name="email" type="email" required dir="ltr"><label>كلمة المرور</label><input name="pw" type="password" required><div id="lerr"></div><button class="btn" style="width:100%;margin-top:14px" type="submit">دخول</button></form></div></main>`;
  $("#loginForm").onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    if (v.email === ADMIN_EMAIL && v.pw === ADMIN_PASSWORD) { localStorage.setItem("isAdmin", "1"); localStorage.setItem("role", "admin"); localStorage.setItem("name", "الأستاذ محمد"); A.role="admin"; A.name="الأستاذ محمد"; await loadBase(); initApp(); return; }
    const snap = await getDocs(query(collection(db, "users"), where("email", "==", v.email), where("password", "==", v.pw), where("active", "==", true)));
    if (!snap.empty) { const u = snap.docs[0].data(); localStorage.setItem("isAdmin", "1"); localStorage.setItem("role", u.role); localStorage.setItem("name", u.name); A.role=u.role; A.name=u.name; await loadBase(); initApp(); return; }
    $("#lerr").innerHTML = `<div class="err">بيانات غير صحيحة</div>`;
  };
}

const NAV_T = [["dashboard", "الرئيسية"], ["students", "الطلاب"], ["scan", "مسح QR"], ["centers", "السناتر"], ["homework", "الواجبات"], ["exams", "الامتحانات"], ["notifs", "الإشعارات"], ["assistants", "المساعدون"], ["reports", "التقارير"]];
const NAV_A = [["dashboard", "الرئيسية"], ["students", "الطلاب"], ["scan", "مسح QR"], ["homework", "الواجبات"], ["exams", "الامتحانات"]];
const navItems = () => isT() ? NAV_T : NAV_A;

function renderShell() {
  app.innerHTML = `<header class="top"><a class="logo" href="#/dashboard"><span class="mark">√</span><span>المصطفى</span></a><span class="sp"></span><span class="chip ok">${esc(A.name)}</span><button class="btn ghost sm" onclick="localStorage.clear();location.reload()">خروج</button></header>
  <nav class="pills" id="nav">${navItems().map(([k, t]) => `<a href="#/${k}" data-k="${k}">${t}</a>`).join("")}</nav><main id="view"></main>`;
}

const V = {};
async function route() {
  let r = (location.hash || "#/").slice(2) || "dashboard"; if (!navItems().some(n => n[0] === r)) r = "dashboard";
  $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.k === r));
  const el = $("#view"); el.innerHTML = `<div class="spin"></div>`;
  try { await V[r](el); } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
window.addEventListener("hashchange", route);

V.dashboard = async el => {
  el.innerHTML = `<h2>أهلًا ${esc(A.name)} 👋</h2><div class="grid g4">
    <a class="card" href="#/scan" style="display:block;color:inherit"><div style="font-size:2rem">📷</div><b>تسجيل الحضور</b></a>
    <a class="card" href="#/students" style="display:block;color:inherit"><div style="font-size:2rem">👥</div><b>الطلاب</b></a>
    ${isT() ? `<a class="card" href="#/centers" style="display:block;color:inherit"><div style="font-size:2rem">📍</div><b>السناتر</b></a>` : ''}
  </div>`;
};

let scanner = null, scanLock = false;
V.scan = async el => {
  el.innerHTML = `<h2>تسجيل الحضور والواجب</h2>
  <div class="card c"><div id="reader" style="display:none;"></div><div id="scanmsg" class="mut">وجّه الكاميرا نحو كود الطالب</div>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="startScan()" id="sbtn">📷 فتح الكاميرا</button></div>
  <label class="btn ghost" style="width:100%;margin-top:10px;cursor:pointer">📁 تصوير الكود من المعرض<input type="file" accept="image/*" capture="environment" id="qr-file" style="display:none"></label></div>
  <div id="result"></div>`;

  $("#qr-file").onchange = async e => {
    if (!e.target.files.length) return; $("#result").innerHTML = `<div class="spin"></div>`;
    try { const txt = await new Html5Qrcode("reader").scanFile(e.target.files[0], false); showScanResult(await processScan(txt)); } catch { $("#result").innerHTML = `<div class="err">لم يتم العثور على كود واضح</div>`; }
    e.target.value = "";
  };
  if (window.location.protocol === "https:") startScan(); else { $("#scanmsg").innerHTML = `<div class="err">المتصفح يمنع الكاميرا بدون https. استخدم زر تصوير الكود.</div>`; $("#sbtn").style.display="none"; }
};

async function startScan() {
  if (scanner) return;
  try { scanner = new Html5Qrcode("reader"); await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, t => { if(!scanLock){ scanLock = true; onDecode(t); } }, () => {}); $("#sbtn").style.display="none"; $("#reader").style.display="block"; } catch (e) { $("#scanmsg").innerHTML = `<div class="err">تعذر تشغيل الكاميرا</div>`; }
}
async function onDecode(txt) {
  $("#result").innerHTML = `<div class="spin"></div>`;
  try { showScanResult(await processScan(txt)); } catch (e) { $("#result").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function stuCardHTML(stu, g, hwList) {
  return `<div class="fancy-card">
    <div class="fancy-header"><div class="avatar-circle">${esc(stu.name.charAt(0))}</div><div><h3 style="margin:0">${esc(stu.name)}</h3><div class="chip">${esc(stu.grade)}</div></div></div>
    <dl class="fancy-kv"><dt>الكود</dt><dd>${esc(stu.code)}</dd><dt>المجموعة</dt><dd>${g ? esc(g.name) : '—'}</dd></dl></div>
    
    ${hwList.length ? `<div style="margin-top:20px; border-top:2px dashed var(--line); padding-top:15px;">
      <h3 style="color:var(--g); text-align:center;">📝 متابعة الواجب</h3>
      ${hwList.map(({h, t}) => `
        <div class="card" style="margin-top:10px; text-align:center; border:2px solid ${t && t.done ? 'var(--g2)' : (t && !t.done ? 'var(--red)' : 'var(--line)')};">
          <div style="font-weight:800; font-size:1.2rem; margin-bottom:10px;">${esc(h.title)}</div>
          <div class="row" style="gap:10px;">
            <button class="btn ${t && t.done ? "" : "ghost"}" style="flex:1; font-size:1.2rem; padding:15px;" onclick="markHW('${h.id}','${stu.id}','${g.id}','1')">✔ حلّه</button>
            <button class="btn red ${t && !t.done ? "" : "ghost"}" style="flex:1; font-size:1.2rem; padding:15px; ${t && !t.done ? "" : "color:var(--red);border-color:var(--red)"}" onclick="markHW('${h.id}','${stu.id}','${g.id}','0')">✘ لم يحلّه</button>
          </div>
          ${t ? `<div class="sm mut" style="margin-top:8px;">سجله: ${esc(t.recordedByName || 'المساعد')}</div>` : ''}
        </div>
      `).join("")}
    </div>` : `<div class="mut c" style="margin-top:15px;">لا توجد واجبات مطلوبة حالياً</div>`}
    
    <button class="btn big" style="margin-top:20px" onclick="document.getElementById('result').innerHTML=''; scanLock=false; document.getElementById('reader').style.display='block'; startScan();">📷 مسح الطالب التالي</button>`;
}

async function processScan(txt) {
  const p = txt.split("|"); if (p.length !== 3 || p[0] !== "MSTF1") throw { message: "كود غير صالح" };
  const sn = await getDoc(doc(db, "students", p[1])); if (!sn.exists() || sn.data().qrToken !== p[2]) throw { message: "كود غير معروف" };
  const stu = { id: sn.id, ...sn.data() };
  const en = mapDocs(await getDocs(query(collection(db, "groupEnrollments"), where("studentId", "==", stu.id), where("active", "==", true))));
  const g = en.length ? gById(en[0].groupId) : null;
  
  if (g) {
    // تسجيل الحضور
    const sid = `${g.id}_${todayStr()}`;
    const ex = await getDoc(doc(db, "attendanceRecords", `${sid}_${stu.id}`));
    if (!ex.exists()) {
      await setDoc(doc(db, "attendanceRecords", `${sid}_${stu.id}`), { sessionId: sid, groupId: g.id, centerId: g.centerId, studentId: stu.id, studentName: stu.name, date: todayStr(), status: "present", source: "qr", markedBy: A.user.uid, markedByName: A.name, markedAt: serverTimestamp() });
    }
  }
  
  // جلب الواجبات
  let hwList = [];
  if (g) {
    const hs = mapDocs(await getDocs(query(collection(db, "homework"), where("groupIds", "array-contains", g.id)))).filter(h => h.status !== "ended");
    const tr = await Promise.all(hs.map(h => getDoc(doc(db, "homeworkTracking", `${h.id}_${stu.id}`))));
    hwList = hs.map((h, i) => ({ h, t: tr[i].exists() ? tr[i].data() : null }));
  }
  window.currentG = g; window.currentStu = stu;
  return { stu, g, hwList };
}

function showScanResult({ stu, g, hwList }) {
  $("#result").innerHTML = `<div class="card" style="background:transparent;box-shadow:none;border:none;padding:0;">
    <div class="okmark" style="margin:0 auto 15px;">✓</div><h2 class="c" style="color:var(--g); margin-bottom:20px;">تم تسجيل الحضور</h2>
    ${stuCardHTML(stu, g, hwList)}
  </div>`;
}

window.markHW = async (hid, stuId, gid, val) => {
  await setDoc(doc(db, "homeworkTracking", `${hid}_${stuId}`), { homeworkId: hid, studentId: stuId, groupId: gid, date: todayStr(), done: val === "1", recordedBy: A.user.uid, recordedByName: A.name, recordedAt: serverTimestamp() });
  toast(val === "1" ? "تم تسجيل: حل الواجب" : "تم تسجيل: لم يحل الواجب");
  // تحديث الشاشة
  const hs = mapDocs(await getDocs(query(collection(db, "homework"), where("groupIds", "array-contains", gid)))).filter(h => h.status !== "ended");
  const tr = await Promise.all(hs.map(h => getDoc(doc(db, "homeworkTracking", `${h.id}_${stuId}`))));
  const hwList = hs.map((h, i) => ({ h, t: tr[i].exists() ? tr[i].data() : null }));
  showScanResult({ stu: window.currentStu, g: window.currentG, hwList });
};

// صفحة الواجبات العامة
V.homework = async el => {
  const hs = mapDocs(await getDocs(collection(db, "homework"))).sort((a,b)=>b.assignedDate.localeCompare(a.assignedDate));
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2>الواجبات</h2><button class="btn" onclick="addHW()">+ واجب جديد</button></div>
  ${hs.map(h => `<div class="card"><h3 style="margin:0">${esc(h.title)}</h3><div class="sm mut">${(h.groupIds||[]).map(id=>esc((gById(id)||{}).name||'')).join('، ')}</div>
  <button class="btn sm ghost" style="margin-top:10px" onclick="trackHW('${h.id}')">تسجيل الواجب (بدون كيو ار)</button></div>`).join("")}`;
};

window.addHW = () => openModal("واجب جديد", `<form id="hwF"><label>العنوان</label><input name="title" required><label>الوصف</label><textarea name="desc"></textarea><label>المجموعات</label>${activeGroups().map(g=>`<label><input type="checkbox" name="g_${g.id}"> ${g.name}</label>`).join('')}<button class="btn" style="margin-top:10px" type="submit">حفظ</button></form>`, true).querySelector('form').onsubmit = async e => {
  e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const gIds = Object.keys(v).filter(k=>k.startsWith('g_')).map(k=>k.slice(2));
  await addDoc(collection(db,"homework"), { title: v.title, description: v.desc, groupIds: gIds, assignedDate: todayStr(), status: "active", createdAt: serverTimestamp() }); closeModals(); route();
};

window.trackHW = async hid => {
  const h = (await getDoc(doc(db,"homework",hid))).data();
  const ens = await Promise.all(h.groupIds.map(gid => getDocs(query(collection(db,"groupEnrollments"), where("groupId","==",gid), where("active","==",true))).then(mapDocs)));
  const stu = [...new Map(ens.flat().map(x=>[x.studentId,x])).values()];
  const tr = mapDocs(await getDocs(query(collection(db,"homeworkTracking"), where("homeworkId","==",hid))));
  const by = Object.fromEntries(tr.map(x=>[x.studentId,x]));
  openModal("متابعة الواجب", `<div class="tw"><table><tbody>${stu.map(s=>{ const x=by[s.studentId]; return `<tr><td>${esc(s.studentName)}</td><td><button class="btn sm ${x&&x.done?'':'ghost'}" onclick="markHW('${hid}','${s.studentId}','${s.groupId}','1');this.closest('tr').nextElementSibling?this.closest('tr').nextElementSibling.remove():0;this.closest('tr').innerHTML='<td>${esc(s.studentName)}</td><td><span class=chip ok>✔</span></td>'">✔</button> <button class="btn sm red ${x&&!x.done?'':'ghost'}" onclick="markHW('${hid}','${s.studentId}','${s.groupId}','0');this.closest('tr').innerHTML='<td>${esc(s.studentName)}</td><td><span class=chip bad>✘</span></td>'">✘</button></td></tr>` }).join("")}</tbody></table></div>`, true);
};

// طلاب، امتحانات، سناتر (باقي الأكواد كما هي)
V.students = async el => {
  const sts = mapDocs(await getDocs(collection(db,"students")));
  el.innerHTML = `<h2>الطلاب</h2><div class="card"><input id="sq" placeholder="بحث..." oninput="this.nextElementSibling.innerHTML=sts.filter(s=>s.name.includes(this.value)).map(s=>'<div class=card style=margin-bottom:5px>'+s.name+' - '+s.code+'</div>').join('')||''"></div><div id="sl"></div>`;
  window.sts = sts;
};

V.centers = async el => {
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2>السناتر</h2><button class="btn" onclick="addCenter()">+ سنتر</button></div>
  ${A.centers.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="row"><button class="btn sm" onclick="addGroup('${c.id}')">+ مجموعة</button></div>${A.groups.filter(g=>g.centerId===c.id).map(g=>`<div style="margin-top:5px;padding:5px;background:#eee;border-radius:5px">${esc(g.name)} - ${esc(g.grade)}</div>`).join('')}</div>`).join('')}`;
};
window.addCenter = () => openModal("سنتر جديد", `<form id="cF"><label>الاسم</label><input name="name" required><button class="btn" style="margin-top:10px">حفظ</button></form>`).querySelector('form').onsubmit = async e => { e.preventDefault(); await addDoc(collection(db,"centers"), { name: e.target.name.value }); closeModals(); await loadBase(); route(); };
window.addGroup = cid => openModal("مجموعة", `<form id="gF"><label>الاسم</label><input name="name" required><label>السنة</label><input name="grade" required><label>البداية</label><input type="time" name="start" value="16:00"><label>النهاية</label><input type="time" name="end" value="18:00"><button class="btn" style="margin-top:10px">حفظ</button></form>`).querySelector('form').onsubmit = async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); await addDoc(collection(db,"groups"), { name: v.name, grade: v.grade, centerId: cid, start: v.start, end: v.end, days: [0,1,2,3,4,5,6], active: true }); closeModals(); await loadBase(); route(); };

V.exams = async el => {
  const ex = mapDocs(await getDocs(collection(db,"exams")));
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2>الامتحانات</h2><button class="btn" onclick="addExam()">+ امتحان</button></div>
  ${ex.map(e=>`<div class="card"><h3>${esc(e.name)}</h3><div class="sm mut">الدرجة: ${e.total}</div><button class="btn sm" style="margin-top:10px" onclick="scores('${e.id}')">الدرجات</button></div>`).join('')}`;
};
window.addExam = () => openModal("امتحان", `<form id="eF"><label>الاسم</label><input name="name" required><label>الدرجة</label><input type="number" name="total" required><label>المجموعات</label>${activeGroups().map(g=>`<label><input type="checkbox" name="g_${g.id}"> ${g.name}</label>`).join('')}<button class="btn" style="margin-top:10px">حفظ</button></form>`).querySelector('form').onsubmit = async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const gIds = Object.keys(v).filter(k=>k.startsWith('g_')).map(k=>k.slice(2)); await addDoc(collection(db,"exams"), { name: v.name, total: Number(v.total), groupIds: gIds, date: todayStr() }); closeModals(); route(); };
window.scores = async eid => {
  const e = (await getDoc(doc(db,"exams",eid))).data();
  const ens = await Promise.all(e.groupIds.map(gid => getDocs(query(collection(db,"groupEnrollments"), where("groupId","==",gid), where("active","==",true))).then(mapDocs)));
  const stu = [...new Map(ens.flat().map(x=>[x.studentId,x])).values()];
  const rs = mapDocs(await getDocs(query(collection(db,"examResults"), where("examId","==",eid))));
  const by = Object.fromEntries(rs.map(x=>[x.studentId,x]));
  openModal("الدرجات", `<form id="sF">${stu.map(s=>`<div class="row" style="justify-content:space-between;margin-bottom:5px"><span>${esc(s.studentName)}</span><input type="number" name="s_${s.studentId}" value="${by[s.studentId]?by[s.studentId].score:''}" style="width:80px" max="${e.total}"></div>`).join('')}<button class="btn" style="margin-top:10px;width:100%">حفظ</button></form>`, true).querySelector('form').onsubmit = async ev => { ev.preventDefault(); const v = Object.fromEntries(new FormData(ev.target)); const b = writeBatch(db); stu.forEach(s=>{ if(v['s_'+s.studentId]) b.set(doc(db,"examResults",`${eid}_${s.studentId}`), { examId: eid, examName: e.name, studentId: s.studentId, studentName: s.studentName, score: Number(v['s_'+s.studentId]), total: e.total, date: e.date, published: true }); }); await b.commit(); closeModals(); toast("تم حفظ الدرجات"); };
};

V.notifs = async el => { el.innerHTML = `<h2>الإشعارات</h2><div class="card"><p class="mut c">قريباً...</p></div>`; };
V.assistants = async el => {
  const as = mapDocs(await getDocs(query(collection(db,"users"),where("role","==","assistant"))));
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2>المساعدون</h2><button class="btn" onclick="addAsst()">+ مساعد</button></div>
  ${as.map(a=>`<div class="card"><h3>${esc(a.name)}</h3><div>${esc(a.email)} - ${esc(a.password)}</div></div>`).join('')}`;
};
window.addAsst = () => openModal("مساعد", `<form id="aF"><label>الاسم</label><input name="name" required><label>البريد</label><input name="email" type="email" required><label>الباسورد</label><input name="pw" required><button class="btn" style="margin-top:10px">حفظ</button></form>`).querySelector('form').onsubmit = async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); await addDoc(collection(db,"users"), { name: v.name, email: v.email, password: v.pw, role: "assistant", active: true }); closeModals(); route(); };
V.reports = async el => { el.innerHTML = `<h2>التقارير</h2><div class="card c mut">قريباً</div>`; };

function initApp() { renderShell(); route(); }
if (localStorage.getItem("isAdmin") === "1") { A.role = localStorage.getItem("role"); A.name = localStorage.getItem("name"); loadBase().then(initApp); } else { renderLogin(); }
</script>
