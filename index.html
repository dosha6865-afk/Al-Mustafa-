const _fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Cairo", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function cairoParts(d = new Date()) { const o = {}; _fmt.formatToParts(d).forEach(p => o[p.type] = p.value); return o; }
function todayStr(d = new Date()) { const p = cairoParts(d); return `${p.year}-${p.month}-${p.day}`; }
function dowOf(dateStr) { return new Date(dateStr + "T12:00:00Z").getUTCDay(); }
function tzOffsetMin(d) { const p = cairoParts(d); const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second); return Math.round((asUTC - Math.floor(d.getTime() / 1000) * 1000) / 60000); }
function cairoInstant(dateStr, hhmm) {
  const [y, m, d] = dateStr.split("-").map(Number), [h, mi] = (hhmm || "00:00").split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  let off = tzOffsetMin(new Date(guess - 3 * 3600000));
  let t = guess - off * 60000; off = tzOffsetMin(new Date(t));
  return new Date(guess - off * 60000);
}
// بداية ونهاية الحصة (لو النهاية قبل البداية تعتبر الحصة بتعدي منتصف الليل)

  const st = cairoInstant(date, dt.start); let end = cairoInstant(date, dt.end);

}

function askForm(title, html, okText = "تأكيد") {
  return new Promise(res => {

function getGroupDayTime(g, dow) {

  return { start: g.start || "16:00", end: g.end || "18:00" };
}

async function closeSession(sid) {
  const sRef = doc(db, "sessions", sid), s = (await getDoc(sRef)).data();
  const [en, rc] = await Promise.all([getDocs(query(collection(db, "groupEnrollments"), where("groupId", "==", s.groupId), where("active", "==", true))), getDocs(query(collection(db, "attendanceRecords"), where("sessionId", "==", sid)))]);
  const have = new Set(rc.docs.map(d => d.data().studentId));
  const missing = en.docs.map(d => d.data()).filter(e => !have.has(e.studentId) && !(e.joinedAt && e.joinedAt.toMillis() > s.endsAt.toMillis()));
  for (let i = 0; i < missing.length; i += 400) {
    const b = writeBatch(db);
    missing.slice(i, i + 400).forEach(e => b.set(doc(db, "attendanceRecords", `${sid}_${e.studentId}`), { sessionId: sid, groupId: s.groupId, centerId: s.centerId, studentId: e.studentId, studentName: e.studentName || "", date: s.date, status: "absent", source: "close", markedBy: A.user.uid, markedByName: A.name, markedAt: serverTimestamp() }));
    await b.commit();
  }
  await updateDoc(sRef, { status: "closed", closedAt: serverTimestamp(), closedBy: A.user.uid });
  await audit("session_close", "session", sid, { absentAdded: missing.length });
  return missing.length;
}

    if (acDay !== today) { await ensureToday(today); acDay = today; }
    const open = mapDocs(await getDocs(query(collection(db, "sessions"), where("status", "==", "open"))));
    for (const s of open) {

}

(async () => {
  let s = null; try { s = JSON.parse(localStorage.getItem("msAuth") || "null"); } catch (e) { }
  if (!s && localStorage.getItem("isAdminLoggedIn") === "true") s = { role: "admin" };
  if (!s) { renderLogin(); return; }
  if (s.role === "assistant") {
    try {
      const u = await getDoc(doc(db, "users", s.uid));
      if (!u.exists() || u.data().active === false) { localStorage.removeItem("msAuth"); renderLogin("هذا الحساب غير متاح"); return; }
      A.role = "assistant"; A.user = { uid: s.uid }; A.name = u.data().name;
    } catch (e) { renderLogin("تعذر التحقق من الحساب"); return; }
  } else { A.role = "admin"; A.user = { uid: "local_admin" }; A.name = "الأستاذ محمد"; }
  await loadBase(); renderShell(); route(); startAutoClose();
})();
</script>
</body>
