.list>div{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.list>div:last-child{border:0}

@media print{header.top,nav.pills,.noprint,.toast,footer.f{display:none!important}body{background:#fff}main{padding:0}.card,.stat{box-shadow:none}.tw{max-height:none;overflow:visible}}

<script type="module">

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const PHRASES = ["كل مسألة ليها حل", "افهمها، ما تحسبهاش", "طريق التفوق بيبدأ بالمعادلة", "مع المصطفى، كل معادلة ليها حل"];
const rnd = a => a[Math.floor(Math.random() * a.length)];
const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ar");
const normPhone = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");

const _fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Cairo", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function cairoParts(d = new Date()) { const o = {}; _fmt.formatToParts(d).forEach(p => o[p.type] = p.value); return o; }
function todayStr(d = new Date()) { const p = cairoParts(d); return `${p.year}-${p.month}-${p.day}`; }
function dowOf(dateStr) { return new Date(dateStr + "T12:00:00Z").getUTCDay(); }
function tzOffsetMin(d) { const p = cairoParts(d); const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second); return Math.round((asUTC - Math.floor(d.getTime() / 1000) * 1000) / 60000); }
function cairoInstant(dateStr, hhmm) {
  const [y, m, d] = dateStr.split("-").map(Number), [h, mi] = hhmm.split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  let off = tzOffsetMin(new Date(guess - 3 * 3600000));
  let t = guess - off * 60000; off = tzOffsetMin(new Date(t));
  return new Date(guess - off * 60000);
}
const fmtTime = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "م" : "ص"}`; };
const sched = g => `${(g.days || []).map(d => DAYS[d]).join("، ")} • ${fmtTime(g.start)} – ${fmtTime(g.end)}`;
const fmtDate = s => s ? new Date(s + "T12:00:00Z").toLocaleDateString("ar-EG", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
const fmtTs = t => t && t.toDate ? t.toDate().toLocaleString("ar-EG", { timeZone: "Africa/Cairo", dateStyle: "medium", timeStyle: "short" }) : "";
const minutesBetween = (a, b) => Math.round((b - a) / 60000);

function toast(m, t = "ok") { const d = document.createElement("div"); d.className = "toast " + t; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }
function openModal(title, html, wide) {
  const w = document.createElement("div"); w.className = "mback";
  w.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><div class="mh"><b>${esc(title)}</b><button class="x" data-close aria-label="إغلاق">✕</button></div><div class="mb">${html}</div></div>`;
  w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-close]")) w.remove(); });
  document.body.appendChild(w); return w;
}
const closeModals = () => $$(".mback").forEach(m => m.remove());
function errMsg(e) { return (e && e.message) || "حدث خطأ"; }
async function run(el, fn) {
  const b = el && el.closest ? el.closest("button,.btn") : null; if (b) b.disabled = true;
  try { return await fn(); } catch (e) { console.error(e); toast(errMsg(e), "err"); } finally { if (b) b.disabled = false; }
}
const ACT = {};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (!t) return; const f = ACT[t.dataset.act]; if (f) { if (t.tagName === "A") e.preventDefault(); run(t, () => f(t, e)); } });
document.addEventListener("submit", e => { const f = e.target.closest("form[data-submit]"); if (!f) return; e.preventDefault(); const fn = ACT[f.dataset.submit]; if (fn) run(f.querySelector("button[type=submit]"), () => fn(f, e)); });
const formData = f => Object.fromEntries(new FormData(f));
const qs = k => new URLSearchParams(location.hash.split("?")[1] || "").get(k);
const statusChip = s => s === "present" ? `<span class="chip ok">حاضر</span>` : s === "absent" ? `<span class="chip bad">غائب</span>` : s === "excused" ? `<span class="chip warn">مستأذن</span>` : `<span class="chip">—</span>`;
function attStats(recs) {
  const p = recs.filter(r => r.status === "present").length, a = recs.filter(r => r.status === "absent").length, e = recs.filter(r => r.status === "excused").length;
  const base = p + a; return { p, a, e, total: p + a + e, pct: base ? Math.round(p / base * 100) : null };
}
const sortRecs = rs => [...rs].sort((x, y) => String(y.date).localeCompare(String(x.date)) || ((y.markedAt?.seconds || 0) - (x.markedAt?.seconds || 0)));
const mapDocs = s => s.docs.map(d => ({ id: d.id, ...d.data() }));

const app = $("#app");
const A = { user: { uid: "local_admin" }, role: "admin", name: "الأستاذ محمد", centers: [], groups: [], students: null, unsubs: [] };
const isT = () => A.role === "admin"; 
const gById = id => A.groups.find(g => g.id === id), cById = id => A.centers.find(c => c.id === id);
const unsubAll = () => { A.unsubs.forEach(f => f()); A.unsubs = []; };
const listen = (q, cb) => { A.unsubs.push(onSnapshot(q, s => cb(mapDocs(s)), e => console.warn(e))); };
async function loadBase() {
  try {
    const [c, g] = await Promise.all([getDocs(collection(db, "centers")), getDocs(collection(db, "groups"))]);
    A.centers = mapDocs(c).sort(byName); A.groups = mapDocs(g).sort(byName);
  } catch (e) { console.error("LoadBase Error:", e); toast("خطأ في تحميل البيانات (تأكد من قواعد الأمان)", "err"); }
}
async function loadStudents(force) { if (!A.students || force) A.students = mapDocs(await getDocs(collection(db, "students"))); return A.students; }
const activeGroups = () => A.groups.filter(g => g.active !== false);
async function audit(action, targetType, targetId, details = {}, reason = "") {
  try { await addDoc(collection(db, "auditLogs"), { actorId: A.user.uid, actorName: A.name, actorRole: A.role, action, targetType, targetId, details, reason, at: serverTimestamp() }); } catch(e) {}
}
const sessionFields = (g, date) => ({ groupId: g.id, groupName: g.name, centerId: g.centerId, centerName: (cById(g.centerId) || {}).name || g.centerName || "", date, startsAt: Timestamp.fromDate(cairoInstant(date, g.start)), endsAt: Timestamp.fromDate(cairoInstant(date, g.end)), status: "open", createdBy: A.user.uid, createdAt: serverTimestamp() });
async function ensureSession(g, date) {
  const ref = doc(db, "sessions", `${g.id}_${date}`); let s = await getDoc(ref);
  if (!s.exists()) { try { await setDoc(ref, sessionFields(g, date)); } catch (e) { s = await getDoc(ref); if (!s.exists()) throw e; } s = await getDoc(ref); }
  return { id: s.id, ...s.data() };
}

function renderLogin(msg) {
  app.innerHTML = `<main><div class="card auth"><div class="logo" style="justify-content:center"><span class="mark">√</span><span>المصطفى في الرياضيات<small>لوحة الإدارة</small></span></div>
  <form data-submit="login"><label>البريد الإلكتروني</label><input name="email" type="email" autocomplete="username" required dir="ltr">
  <label>كلمة المرور</label><input name="pw" type="password" autocomplete="current-password" required>
  ${msg ? `<div class="err">${esc(msg)}</div>` : ""}<button class="btn" style="width:100%;margin-top:14px" type="submit">دخول</button></form>
  <div class="phrase" style="padding:8px">كل مسألة ليها حل</div></div></main>`;

// تسجيل دخول مباشر (بدون Firebase Auth)
ACT.login = async f => {
  const v = formData(f);
  const email = v.email.trim();
  
  // فحص الأدمن
  if (email === ADMIN_EMAIL && v.pw === ADMIN_PASSWORD) {
    localStorage.setItem("isAdminLoggedIn", "true");
    localStorage.setItem("userRole", "admin");
    localStorage.setItem("userName", "الأستاذ محمد");
    A.role = "admin";
    A.name = "الأستاذ محمد";
    await loadBase(); renderShell(); route();
    return;
  }

  // فحص المساعدين (بحث مباشر في قاعدة البيانات)
  const q = query(collection(db, "users"), where("email", "==", email), where("password", "==", v.pw), where("role", "==", "assistant"), where("active", "==", true));
  const snap = await getDocs(q);
  
  if (!snap.empty) {
    const user = snap.docs[0].data();
    localStorage.setItem("isAdminLoggedIn", "true");
    localStorage.setItem("userRole", "assistant");
    localStorage.setItem("userName", user.name);
    A.role = "assistant";
    A.name = user.name;
    await loadBase(); renderShell(); route();
    return;
  }

  throw { message: "بيانات الدخول غير صحيحة" };
};

ACT.logout = async () => { 
  localStorage.removeItem("isAdminLoggedIn"); 
  localStorage.removeItem("userRole");
  localStorage.removeItem("userName");
  location.hash = "#/"; 
  location.reload(); 
};

async function ensureToday(date) {
  const dow = dowOf(date); const gs = activeGroups().filter(g => (g.days || []).includes(dow)); const out = [];
  for (const g of gs) { try { out.push({ g, s: await ensureSession(g, date) }); } catch (e) { console.warn("session", g.name, e); out.push({ g, s: null }); } }
  return out;
}

async function closeSession(sid) {
  const sRef = doc(db, "sessions", sid), s = (await getDoc(sRef)).data();
  const [en, rc] = await Promise.all([getDocs(query(collection(db, "groupEnrollments"), where("groupId", "==", s.groupId), where("active", "==", true))), getDocs(query(collection(db, "attendanceRecords"), where("sessionId", "==", sid)))]);
  const have = new Set(rc.docs.map(d => d.data().studentId));
  const missing = en.docs.map(d => d.data()).filter(e => !have.has(e.studentId) && !(e.joinedAt && e.joinedAt.toMillis() > s.endsAt.toMillis()));
  for (let i = 0; i < missing.length; i += 400) {
    const b = writeBatch(db);
    missing.slice(i, i + 400).forEach(e => b.set(doc(db, "attendanceRecords", `${sid}_${e.studentId}`), { sessionId: sid, groupId: s.groupId, centerId: s.centerId, studentId: e.studentId, studentName: e.studentName || "", date: s.date, status: "absent", source: "close", markedBy: A.user.uid, markedByName: A.name, markedAt: serverTimestamp() }));
    await b.commit();
  }
  await updateDoc(sRef, { status: "closed", closedAt: serverTimestamp(), closedBy: A.user.uid });
  await audit("session_close", "session", sid, { absentAdded: missing.length });
  return missing.length;
}

let scanner = null, scanLock = false, scanning = false;
const parseQR = t => { const p = String(t).trim().split("|"); return p.length === 3 && p[0] === "MSTF1" ? { uid: p[1], token: p[2] } : null; };

async function startScan() {
  if (scanning) return; if (!window.Html5Qrcode) { toast("تعذر تحميل مكتبة الكاميرا، تأكد من الإنترنت", "err"); return; }
  try {
    $("#reader").style.display = "block";
    scanner = new Html5Qrcode("reader"); scanLock = false;
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * .72); return { width: s, height: s }; } }, onDecode, () => { });
    scanning = true; const b = $("#sbtn"); if (b) b.style.display = "none";
  } catch (e) {
    console.warn(e); const m = $("#scanmsg");
    if (m) m.innerHTML = `<div class="err">تعذر تشغيل الكاميرا. اسمح للموقع باستخدام الكاميرا.</div>`;
  }
}
ACT.startScan = () => startScan();
function stopScan() { if (scanner) { const s = scanner; scanner = null; scanning = false; s.stop().then(() => s.clear()).catch(() => { }); } }
async function onDecode(text) {
  if (scanLock) return; scanLock = true; navigator.vibrate && navigator.vibrate(60);
  $("#result").innerHTML = `<div class="spin"></div>`;
  try { const r = await processScan(text); showScanResult(r); }
  catch (e) { console.error(e); $("#result").innerHTML = `<div class="card"><div class="okmark bad">!</div><div class="err">${esc(errMsg(e))}</div><button class="btn big" data-act="nextScan">مسح التالي</button></div>`; }
}
ACT.nextScan = () => { $("#result").innerHTML = ""; scanLock = false; };
async function recentRecords(stuId) { return sortRecs(mapDocs(await getDocs(query(collection(db, "attendanceRecords"), where("studentId", "==", stuId))))).slice(0, 4); }
async function homeworkFor(stu, gid, sid, date) {
  const hs = mapDocs(await getDocs(query(collection(db, "homework"), where("groupIds", "array-contains", gid)))).filter(h => h.status !== "ended");
  const tr = await Promise.all(hs.map(h => getDoc(doc(db, "homeworkTracking", `${h.id}_${stu.id}`))));
  return hs.map((h, i) => ({ h, t: tr[i].exists() ? tr[i].data() : null }));
}
async function processScan(text) {
  const q = parseQR(text); if (!q) return { kind: "invalid", msg: "كود غير صالح: هذا ليس كود طالب في المنصة" };
  let sn; try { sn = await getDoc(doc(db, "students", q.uid)); } catch (e) { return { kind: "invalid", msg: "كود غير صالح" }; }
  if (!sn.exists() || sn.data().qrToken !== q.token) return { kind: "invalid", msg: "كود غير صالح أو غير معروف. لم يُسجَّل حضور." };
  const stu = { id: sn.id, ...sn.data() };
  if (!stu.active) return { kind: "invalid", msg: "حساب الطالب معطّل. لم يُسجَّل حضور.", stu };
  const en = mapDocs(await getDocs(query(collection(db, "groupEnrollments"), where("studentId", "==", stu.id), where("active", "==", true))));
  const now = new Date(), date = todayStr(now), dow = dowOf(date), cands = [];
  for (const e of en) {
    const g = gById(e.groupId); if (!g || g.active === false || !(g.days || []).includes(dow)) continue;
    const st = cairoInstant(date, g.start), end = cairoInstant(date, g.end);
    if (now >= new Date(st - 120 * 60000) && now <= new Date(+end + 60 * 60000)) cands.push({ g, st, end });
  }
  cands.sort((a, b) => Math.abs(now - a.st) - Math.abs(now - b.st));
  const hist = await recentRecords(stu.id), center = g => (cById(g.centerId) || {}).name || "";
  if (!cands.length) return { kind: "nosession", stu, hist, groups: en.map(e => gById(e.groupId)).filter(Boolean), centerOf: center };
  const { g } = cands[0], sid = `${g.id}_${date}`;
  const sess = await ensureSession(g, date);
  const base = { stu, g, sid, date, hist, center: center(g), sess };
  base.hw = await homeworkFor(stu, g.id, sid, date);
  if (sess.status !== "open") return { kind: "closed", ...base };
  const rid = `${sid}_${stu.id}`, ex = await getDoc(doc(db, "attendanceRecords", rid));
  if (ex.exists()) return { kind: "dup", status: ex.data().status, ...base };
  try {
    await setDoc(doc(db, "attendanceRecords", rid), { sessionId: sid, groupId: g.id, centerId: g.centerId, studentId: stu.id, studentName: stu.name, date, status: "present", source: "qr", qrToken: q.token, markedBy: A.user.uid, markedByName: A.name, markedAt: serverTimestamp() });
  } catch (e) {
    const again = await getDoc(doc(db, "attendanceRecords", rid)); if (again.exists()) return { kind: "dup", status: again.data().status, ...base };
    throw e;
  }
  base.hist = await recentRecords(stu.id);
  return { kind: "ok", status: "present", ...base };
}

async function examRoster(e) {
  const [ens, rs] = await Promise.all([Promise.all((e.groupIds || []).map(gid => getDocs(query(collection(db, "groupEnrollments"), where("groupId", "==", gid), where("active", "==", true))).then(mapDocs))), getDocs(query(collection(db, "examResults"), where("examId", "==", e.id))).then(mapDocs)]);

ACT.scoresSave = async f => {
  const e = A.examList.find(x => x.id === f.dataset.id), res = f._res || {}; const ops = [];
  for (const inp of $$("input[name^=s_]", f)) {
    if (inp.value === "") continue; const sc = Number(inp.value), sid = inp.name.slice(2); if (sc < 0 || sc > e.total) throw { msg: `درجة غير صحيحة` };
    const old = res[sid]; if (old && Number(old.score) === sc) continue;
    ops.push({ sid, sc, old, name: inp.dataset.n, gid: inp.dataset.g });
  }
  for (let i = 0; i < ops.length; i += 200) {
    const b = writeBatch(db);
    ops.slice(i, i + 200).forEach(o => b.set(doc(db, "examResults", `${e.id}_${o.sid}`), { examId: e.id, examName: e.name, date: e.date, total: e.total, studentId: o.sid, studentName: o.name, groupId: o.gid, score: o.sc, published: !!e.published, updatedAt: serverTimestamp(), updatedBy: A.user.uid }));
    await b.commit();
  }
  for (const o of ops) { if (o.old) await audit("exam_score_edit", "examResult", `${e.id}_${o.sid}`, { from: o.old.score, to: o.sc }); }
  await audit("exam_scores_save", "exam", e.id, { changed: ops.length }); closeModals(); toast(`تم حفظ ${ops.length} درجة`);
};
ACT.examResults = async t => {

ACT.notifSend = async f => {
  const v = formData(f), all = !!v.all, grs = Object.keys(v).filter(k => k.startsWith("gr_")).map(k => v[k]), cs = Object.keys(v).filter(k => k.startsWith("c_")).map(k => k.slice(2)), gs = Object.keys(v).filter(k => k.startsWith("g_")).map(k => k.slice(2));
  if (!all && !grs.length && !cs.length && !gs.length) throw { msg: "اختر الفئة المستهدفة" };
  const [stu, en] = await Promise.all([loadStudents(true), getDocs(query(collection(db, "groupEnrollments"), where("active", "==", true))).then(mapDocs)]);
  const target = stu.filter(s => s.active && (all || grs.includes(s.grade) || en.some(e => e.studentId === s.id && (cs.includes(e.centerId) || gs.includes(e.groupId)))));
  if (!target.length) throw { msg: "لا يوجد طلاب مطابقون" };

  const names = [...(all ? ["جميع الطلاب"] : []), ...grs, ...cs.map(id => (cById(id) || {}).name), ...gs.map(id => (gById(id) || {}).name)].filter(Boolean).join("، ");
  const nref = doc(collection(db, "notifications"));
  await setDoc(nref, { title: v.title.trim(), body: v.body.trim(), type: v.type, target: { all, grades: grs, centerIds: cs, groupIds: gs }, targetText: names, targetCount: target.length, createdAt: serverTimestamp(), createdBy: A.user.uid });
  for (let i = 0; i < target.length; i += 400) {
    const b = writeBatch(db);

  }
  await audit("notification_send", "notification", nref.id, { count: target.length }); f.reset(); toast(`تم الإرسال إلى ${target.length} طالب`); rerender();
};

  el.innerHTML = `<h2>التقارير والإحصائيات</h2><div class="card noprint"><div class="tabs" id="rt">${[["att", "الحضور"], ["day", "اليومي"], ["hw", "الواجبات"], ["ex", "الدرجات"], ["stu", "الطلاب والسناتر"]].map(([k, t], i) => `<button data-act="rtab" data-k="${k}" class="${i ? "" : "on"}">${t}</button>`).join("")}</div>
  <div class="row"><div><label>من</label><input type="date" id="rf" value="${d30}"></div><div><label>إلى</label><input type="date" id="rto" value="${todayStr()}"></div>
  <div><label>السنتر</label><select id="rc"><option value="">الكل</option>${A.centers.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div>
  <div><label>المجموعة</label><select id="rg"><option value="">الكل</option>${A.groups.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join("")}</select></div>
  <div><label>السنة</label><select id="ry"><option value="">الكل</option>${grades.map(g => `<option>${esc(g)}</option>`).join("")}</select></div>
  <div style="align-self:end"><button class="btn" data-act="rrun">عرض</button> <button class="btn ghost" onclick="window.print()">طباعة</button> <button class="btn ghost" data-act="rcsv">CSV</button></div></div></div><div id="rout" class="card" style="margin-top:14px"><div class="empty">اختر الفلاتر ثم اضغط «عرض»</div></div>`;
  A.rtab = "att"; A.rcsv = null;
};
ACT.rtab = t => { A.rtab = t.dataset.k; $$("#rt button").forEach(b => b.classList.toggle("on", b === t)); return ACT.rrun(); };
ACT.rcsv = () => { if (A.rcsv) csvDownload("report.csv", A.rcsv); else toast("اعرض التقرير أولًا", "err"); };
ACT.rrun = async () => {
  const f = $("#rf").value, to = $("#rto").value, c = $("#rc").value, g = $("#rg").value, y = $("#ry").value, out = $("#rout"); out.innerHTML = `<div class="spin"></div>`;
  const okG = id => { const gr = gById(id); return gr && (!c || gr.centerId === c) && (!g || gr.id === g) && (!y || gr.grade === y); };
  const tbl = (head, rows) => `<div class="tw"><table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join("")}</tr>`).join("") || `<tr><td colspan=${head.length} class="empty">لا توجد بيانات</td></tr>`}</tbody></table></div>`;
  const pct = s => s.pct === null ? "—" : s.pct + "%";
  const tab = A.rtab;
  if (tab === "att" || tab === "day") {
    const recs = mapDocs(await getDocs(query(collection(db, "attendanceRecords"), where("date", ">=", f), where("date", "<=", to)))).filter(r => okG(r.groupId));
    const total = attStats(recs);
    const cards = `<div class="grid g4"><div class="stat ok"><b>${total.p}</b><span>حضور</span></div><div class="stat bad"><b>${total.a}</b><span>غياب</span></div><div class="stat warn"><b>${total.e}</b><span>استئذان</span></div><div class="stat"><b>${pct(total)}</b><span>نسبة الحضور</span></div></div>`;
    if (tab === "day") {
      const days = [...new Set(recs.map(r => r.date))].sort().reverse(); const rows = days.map(d => { const s = attStats(recs.filter(r => r.date === d)); return [esc(fmtDate(d)), s.p, s.a, s.e, pct(s)]; });
      A.rcsv = [["التاريخ", "حضور", "غياب", "استئذان", "النسبة"], ...rows.map(r => [r[0], ...r.slice(1)])]; out.innerHTML = cards + `<h3 style="margin-top:14px">التقرير اليومي</h3>` + tbl(["التاريخ", "حضور", "غياب", "استئذان", "النسبة"], rows);
    } else {
      const byG = [...new Set(recs.map(r => r.groupId))].map(id => { const s = attStats(recs.filter(r => r.groupId === id)); return [esc((gById(id) || {}).name || ""), esc(((cById((gById(id) || {}).centerId)) || {}).name || ""), s.p, s.a, s.e, pct(s)]; });
      const byS = [...new Set(recs.map(r => r.studentId))].map(id => { const rr = recs.filter(r => r.studentId === id), s = attStats(rr); return [esc(rr[0].studentName), s.p, s.a, s.e, pct(s)]; }).sort((a, b) => String(a[0]).localeCompare(String(b[0]), "ar"));
      A.rcsv = [["الطالب", "حضور", "غياب", "استئذان", "النسبة"], ...byS];
      out.innerHTML = cards + `<h3 style="margin-top:14px">حسب المجموعة</h3>` + tbl(["المجموعة", "السنتر", "حضور", "غياب", "استئذان", "النسبة"], byG) + `<h3 style="margin-top:14px">حضور كل طالب</h3>` + tbl(["الطالب", "حضور", "غياب", "استئذان", "النسبة"], byS);
    }
  } else if (tab === "hw") {
    const [tr, hs] = await Promise.all([getDocs(query(collection(db, "homeworkTracking"), where("date", ">=", f), where("date", "<=", to))).then(mapDocs), getDocs(collection(db, "homework")).then(mapDocs)]);
    const rr = tr.filter(r => okG(r.groupId)), by = [...new Set(rr.map(r => r.homeworkId))].map(id => { const x = rr.filter(r => r.homeworkId === id), yes = x.filter(r => r.done).length; return [esc((hs.find(h => h.id === id) || {}).title || id), yes, x.length - yes, Math.round(yes / x.length * 100) + "%"]; });
    A.rcsv = [["الواجب", "حلّوه", "لم يحلّوه", "النسبة"], ...by]; out.innerHTML = `<h3>متابعة الواجبات</h3>` + tbl(["الواجب", "حلّوه", "لم يحلّوه", "النسبة"], by);
  } else if (tab === "ex") {
    const rs = mapDocs(await getDocs(query(collection(db, "examResults"), where("date", ">=", f), where("date", "<=", to)))).filter(r => okG(r.groupId)), by = [...new Set(rs.map(r => r.examId))].map(id => { const x = rs.filter(r => r.examId === id), avg = x.reduce((a, r) => a + r.score, 0) / x.length; return [esc(x[0].examName), esc(fmtDate(x[0].date)), x.length, avg.toFixed(1) + " / " + x[0].total, Math.round(avg / x[0].total * 100) + "%", Math.max(...x.map(r => r.score))]; });
    A.rcsv = [["الامتحان", "التاريخ", "عدد النتائج", "المتوسط", "النسبة", "الأعلى"], ...by]; out.innerHTML = `<h3>نتائج الامتحانات</h3>` + tbl(["الامتحان", "التاريخ", "عدد النتائج", "المتوسط", "النسبة", "الأعلى"], by);
  } else {
    const [sts, en] = await Promise.all([loadStudents(true), getDocs(query(collection(db, "groupEnrollments"), where("active", "==", true))).then(mapDocs)]);
    const rows = activeGroups().filter(gr => okG(gr.id)).map(gr => [esc(gr.name), esc((cById(gr.centerId) || {}).name || ""), esc(gr.grade), en.filter(e => e.groupId === gr.id).length]);
    A.rcsv = [["المجموعة", "السنتر", "السنة", "عدد الطلاب"], ...rows];
    out.innerHTML = `<div class="grid g4"><div class="stat"><b>${sts.length}</b><span>إجمالي الطلاب المسجلين</span></div><div class="stat ok"><b>${sts.filter(s => s.active).length}</b><span>نشطون</span></div><div class="stat"><b>${A.centers.length}</b><span>سناتر</span></div><div class="stat"><b>${activeGroups().length}</b><span>مجموعات</span></div></div><h3 style="margin-top:14px">أعداد الطلاب في المجموعات</h3>` + tbl(["المجموعة", "السنتر", "السنة", "عدد الطلاب"], rows);
  }
};

V.settings = async el => {
  const logs = mapDocs(await getDocs(query(collection(db, "auditLogs"), orderBy("at", "desc"), limit(40))));
  el.innerHTML = `<h2>إعدادات المنصة</h2><div class="card"><dl class="kv"><dt>المنصة</dt><dd>المصطفى في الرياضيات</dd><dt>المدرس</dt><dd>الأستاذ محمد مصطفى</dd><dt>المنطقة الزمنية</dt><dd>Africa/Cairo</dd><dt>تسجيل الحضور</dt><dd>من 120 دقيقة قبل الحصة حتى 60 دقيقة بعد نهايتها</dd></dl>
  <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="closeAllEnded">إغلاق كل الحصص المنتهية</button></div></div>
  <div class="card"><h3>سجل التدقيق (آخر 40 عملية)</h3><div class="tw"><table><thead><tr><th>الوقت</th><th>المنفّذ</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>${logs.map(l => `<tr><td class="sm">${esc(fmtTs(l.at))}</td><td>${esc(l.actorName)}</td><td>${esc(l.action)}</td><td class="sm mut">${esc(l.reason || "")} ${esc(JSON.stringify(l.details || {}).slice(0, 120))}</td></tr>`).join("") || `<tr><td colspan=4 class="empty">—</td></tr>`}</tbody></table></div></div>`;
};

// Initialize App based on local storage
if (localStorage.getItem("isAdminLoggedIn") === "true") {
  A.role = localStorage.getItem("userRole") || "admin";
  A.name = localStorage.getItem("userName") || "المستخدم";
  loadBase().then(() => { renderShell(); route(); });
} else {
  renderLogin();
}

</script>
